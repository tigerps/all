function DisplayCacheProgress(){window.msgs.innerHTML="تم تحميل الكاش ✔";setTimeout(function(){window.msgs.innerHTML="اغلق الصفحه الأن واعد فتحها  ...";},1500);}

window.applicationCache.onerror=function(e){window.msgs.innerHTML="حدث خطأ أغلق الصفحه واعد فتحها ...";};
